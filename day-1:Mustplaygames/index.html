<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Some Awesome Games</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="main-content">
      <div
        class="card open"
        style="
          background: url(https://img.wallscloud.net/uploads/thumb/1857905760/witcher-3-1-57744-1024x576-MM-80.webp)
            no-repeat center / cover;
        "
      >
        <p>The Witcher 3: Wild Hunt</p>
      </div>
      <div
        class="card closed"
        style="
          background: url(https://wallpapercave.com/wp/wp12898291.jpg) no-repeat
            center / cover;
        "
      >
        <p>Cyberpunk 2077</p>
      </div>
      <div
        class="card closed"
        style="
          background: url(https://i.pinimg.com/736x/d4/7a/2e/d47a2e915437f9497a6f2c76225714cb.jpg)
            no-repeat center / cover;
        "
      >
        <p>Elden Ring</p>
      </div>
      <div
        class="card closed"
        style="
          background: url(https://i.redd.it/t0ki88lcrjof1.jpeg) no-repeat
            center / cover;
        "
      >
        <p>Expedition 33</p>
      </div>
      <div
        class="card closed"
        style="
          background: url(https://i.pinimg.com/736x/96/5f/a2/965fa261ea5bdf4b321889b9826a9ff3.jpg)
            no-repeat center / cover;
        "
      >
        <p>Black Myth: Wukong</p>
      </div>
    </main>

</html>
