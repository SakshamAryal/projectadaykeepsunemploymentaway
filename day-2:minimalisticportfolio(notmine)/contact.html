<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Lumina Creative</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="icon" href="./images/favicon.ico" />
  </head>
  <body>
    <header class="header">
      <div class="container container-sm header-flex">
        <a href="./index.html" class="logo"
          ><img src="./images/logo.png" alt="Lumina Creative" />
        </a>
        <div class="main-menu">
          <a href="./index.html">Home</a>
          <a href="./about.html">About</a>
          <a class="current" href="#">Contact</a>
        </div>
      </div>
    </header>
    <section class="hero dark-bg">
      <div class="container container-lg">
        <h2>
          <span class="bg-primary">Enthusiastic</span> thinkers, creating unique
          endeavors powered by <span class="bg-primary">creativity</span>
        </h2>
      </div>
    </section>
    <section class="contact container container-sm">
      <h2 class="section-title">Contact Us</h2>
      <h4>
        Have a question? Leave your information below we will get back to you as
        soon as possible
      </h4>
      <form name="contact" netlify>
        <div class="form-group">
          <label for="First-Name" class="visually-hidden">First Name</label>
          <input
            type="text"
            name="First-Name"
            id="First-Name"
            placeholder="First Name"
          />
        </div>
        <div class="form-group">
          <label for="Last-Name" class="visually-hidden">Last Name</label>
          <input
            type="text"
            name="Last-Name"
            id="Last-Name"
            placeholder="Last Name"
          />
        </div>
        <div class="form-group">
          <label for="email" class="visually-hidden">Email Address</label>
          <input
            type="email"
            name="email-address"
            id="email"
            placeholder="Email Address"
          />
        </div>
        <div class="form-group">
          <label for="message" class="visually-hidden">Message</label>
          <textarea
            name="message"
            id="message"
            placeholder="Message"
          ></textarea>
        </div>
        <div class="form-group">
          <button type="submit" class="btn">Send Message</button>
        </div>
      </form>
    </section>
    <footer class="footer">
      <div class="container container-lg footer-flex">
        <img src="./images/logo.png" alt="logo" />
        <div>
          <h4>Contact Us:</h4>
          <ul>
            <li>(999) 999-9999</li>
            <li>contact@lumina.mail</li>
            <li>1 Mars Avenue, Milky Way</li>
          </ul>
        </div>
        <div>
          <h4>Follow Us</h4>
          <a href="#"><i class="fab fa-facebook fa-2x"></i></a>
          <a href="#"><i class="fab fa-instagram fa-2x"></i></a>
          <a href="#"><i class="fab fa-twitter fa-2x"></i></a>
          <a href="#"><i class="fab fa-youtube fa-2x"></i></a>
          <a href="#"><i class="fab fa-pinterest fa-2x"></i></a>
        </div>
      </div>
    </footer>
  </body>
</html>
